name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Cloudflare
        run: npm run build:cf

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Write .dev.vars for e2e
        run: |
          {
            echo "AUTH_SECRET=$(openssl rand -hex 32)"
            echo "AUTH_URL=http://localhost:3000"
            echo "AUTH_TRUST_HOST=true"
            echo "E2E_ITINERARY_FIXTURE=true"
          } > .dev.vars

      - name: Run e2e smoke
        run: npm run e2e
        env:
          CI: true
